<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7C3AED">
<title>K12Plus Monitor</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
/* K12Plus colours, plus a chart palette chosen so that neighbouring colours stay
   distinct for people with colour vision deficiency (blue, orange, aqua, yellow). */
:root {
  --bg:#FCFBF8; --surface:#FFFFFF; --ink:#1F2033; --muted:#5E6178; --line:#E9E6F2; --chip:#F5F3FB;
  --primary:#7C3AED; --primary-soft:#EFE7FE;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#14855B; --good-soft:#E3F5EC; --warn:#B45309; --warn-soft:#FDF0DC; --bad:#C2410C;
  --grid:#ECEAF2; --shadow:0 8px 30px rgba(31,32,51,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#12121D; --surface:#1B1B2B; --ink:#F2F1FA; --muted:#A3A6BD; --line:#2B2B44; --chip:#232336;
    --primary:#9D6BFF; --primary-soft:#2A2145;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#4ADE9A; --good-soft:#163326; --warn:#F5B055; --warn-soft:#3A2A12; --bad:#FB8C5A;
    --grid:#26263a; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg:#12121D; --surface:#1B1B2B; --ink:#F2F1FA; --muted:#A3A6BD; --line:#2B2B44; --chip:#232336;
  --primary:#9D6BFF; --primary-soft:#2A2145; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#4ADE9A; --good-soft:#163326; --warn:#F5B055; --warn-soft:#3A2A12; --bad:#FB8C5A; --grid:#26263a;
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'Poppins',system-ui,sans-serif; font-size:15px; line-height:1.5; }
a { color:var(--primary); }
button, input, select { font:inherit; color:inherit; }
.wrap { max-width:1180px; margin:0 auto; padding:0 16px; }
header.top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
header.top .wrap { display:flex; align-items:center; gap:12px; height:64px; }
.brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
.brand img { height:38px; width:auto; }
.brand b { font-family:'Comfortaa',sans-serif; font-size:21px; letter-spacing:.8px; }
.brand span { color:var(--muted); font-weight:500; font-size:14px; border-left:1px solid var(--line); padding-left:10px; }
.who { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); min-width:0; }
.who .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw; }
.btn { display:inline-block; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; cursor:pointer; font-weight:500; text-decoration:none; color:var(--ink); }
.btn:hover { border-color:var(--primary); }
.btn:disabled { opacity:.55; cursor:default; }
.btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
.btn.small { padding:5px 10px; font-size:13px; }
.btn.wide { width:100%; margin-top:6px; }
.link-btn { background:none; border:0; color:var(--primary); cursor:pointer; padding:0; font-size:13px; text-decoration:underline; }
main { padding:18px 0 60px; transition:opacity .15s; }
main.busy { opacity:.6; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px; min-width:0; }
.card.soft { box-shadow:none; background:var(--chip); }
.card h2 { font-size:16px; margin:0 0 10px; }
h2.section { font-size:19px; margin:26px 0 12px; }
h2.section .note { font-weight:400; font-size:13px; }
.signin { max-width:430px; margin:5vh auto 0; }
.signin-logo { height:56px; width:auto; display:block; margin-bottom:10px; }
.signin h1 { font-size:22px; margin:0 0 4px; }
.signin p { color:var(--muted); margin:0 0 16px; font-size:14px; }
label { display:block; font-size:13px; font-weight:500; margin:12px 0 4px; }
label.check { display:flex; gap:8px; align-items:center; font-weight:400; }
input[type=text], input[type=password], input[type=email], input[type=search], input[type=tel], select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
input:focus, select:focus { outline:2px solid var(--primary-soft); border-color:var(--primary); }
.err { color:var(--bad); font-size:14px; margin-top:10px; min-height:1em; }
.note { color:var(--muted); font-size:13px; }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.5px; }
.views { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.sub-views { margin-top:-4px; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:14px; }
.chip.on { background:var(--primary); border-color:var(--primary); color:#fff; }
.chip.acc { border-style:dashed; }
.chip.acc.on { border-style:solid; }
.crumbs { font-size:13px; color:var(--muted); margin:2px 0 6px; display:flex; flex-wrap:wrap; gap:4px; }
.crumbs a { color:var(--muted); text-decoration:none; }
.crumbs a:hover { color:var(--primary); text-decoration:underline; }
.head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.head-text { min-width:0; }
.head h1 { font-size:25px; margin:0; line-height:1.25; }
.head .sub { color:var(--muted); font-size:14px; }
.head .tools { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.school-logo { height:56px; width:56px; object-fit:contain; border-radius:12px; background:#fff; border:1px solid var(--line); padding:4px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface); }
.seg button { border:0; background:none; padding:6px 11px; font-size:13px; cursor:pointer; border-right:1px solid var(--line); }
.seg button:last-child { border-right:0; }
.seg button.on { background:var(--primary); color:#fff; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
.tile { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.tile .k { font-size:13px; color:var(--muted); }
.tile .v { font-size:27px; font-weight:600; line-height:1.2; margin-top:2px; }
.tile .s { font-size:12px; color:var(--muted); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid2 > .card { margin-bottom:16px; }
@media (max-width:860px) { .grid2 { grid-template-columns:1fr; } }
.chart svg { width:100%; height:auto; display:block; overflow:visible; }
.chart.mt { margin-top:16px; }
.card h2.mt { margin-top:22px; }
/* chart marks */
.kc-grid { stroke:var(--grid); stroke-width:1; }
.kc-axis { fill:var(--muted); font-size:11px; font-family:inherit; }
.kc-line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.kc-dot { stroke:var(--surface); stroke-width:2; }
.kc-cross { stroke:var(--muted); stroke-dasharray:3 3; opacity:0; }
.kc-hit.on .kc-cross { opacity:.7; }
.kc-hit.on .kc-col { opacity:.8; }
.kc-link { cursor:pointer; }
.kc-line.s1 { stroke:var(--s1); } .kc-line.s2 { stroke:var(--s2); } .kc-line.s3 { stroke:var(--s3); }
.kc-dot.s1, .kc-col.s1 { fill:var(--s1); } .kc-dot.s2, .kc-col.s2 { fill:var(--s2); } .kc-dot.s3, .kc-col.s3 { fill:var(--s3); }
.kc-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink); margin-top:10px; }
.kc-key { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:0; }
.kc-key.s1, .kc-part.s1, .kc-bar-fill.s1 { background:var(--s1); }
.kc-key.s2, .kc-part.s2, .kc-bar-fill.s2 { background:var(--s2); }
.kc-key.s3, .kc-part.s3, .kc-bar-fill.s3 { background:var(--s3); }
.kc-key.s4, .kc-part.s4, .kc-bar-fill.s4 { background:var(--s4); }
.kc-bar-fill.good { background:var(--good); } .kc-bar-fill.warn { background:var(--warn); }
.kc-parts { display:flex; gap:2px; height:22px; border-radius:6px; overflow:hidden; background:var(--chip); }
.kc-part { min-width:3px; }
.kc-part:hover { opacity:.8; }
.kc-bars { display:flex; flex-direction:column; gap:2px; }
.kc-bar { display:grid; grid-template-columns:minmax(0, 2fr) 3fr 76px; gap:10px; align-items:center; padding:6px 4px; border-radius:8px; text-decoration:none; color:var(--ink); font-size:14px; }
.kc-bar.kc-link:hover { background:var(--chip); }
.kc-bar-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kc-bar-track { height:10px; background:var(--chip); border-radius:5px; overflow:hidden; }
.kc-bar-fill { display:block; height:100%; border-radius:0 5px 5px 0; }
.kc-bar-value { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
@media (max-width:520px) { .kc-bar { grid-template-columns:1fr 64px; } .kc-bar-track { grid-column:1 / -1; grid-row:2; } }
.kc-meter-head { display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
.kc-meter-head b { font-size:20px; }
.kc-meter { height:14px; background:var(--chip); border-radius:7px; overflow:hidden; }
.kc-meter span { display:block; height:100%; background:var(--s1); border-radius:0 7px 7px 0; }
.kc-tip { position:absolute; z-index:50; display:none; pointer-events:none; background:var(--ink); color:var(--bg); font-size:13px; line-height:1.4; padding:8px 10px; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.2); max-width:260px; }
.kc-tip b { display:block; margin-bottom:2px; }
/* tables */
.tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
th { font-weight:500; color:var(--muted); font-size:13px; }
td.num, th.num { text-align:right; }
tr.go { cursor:pointer; }
tr.go:hover td { background:var(--chip); }
td .name { font-weight:500; }
table.users td { white-space:normal; min-width:90px; }
.pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--muted); white-space:nowrap; }
.pill.good { background:var(--good-soft); color:var(--good); }
.pill.warn { background:var(--warn-soft); color:var(--warn); }
.pill.right { background:var(--primary-soft); color:var(--primary); margin-top:3px; }
.row-actions { display:flex; gap:6px; flex-wrap:wrap; }
.filters { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.filters input { flex:2; min-width:200px; }
.filters select { flex:1; min-width:150px; width:auto; }
.pager { display:flex; gap:10px; align-items:center; margin-top:10px; }
ul.plain { list-style:none; margin:0 0 12px; padding:0; }
ul.plain li { padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
ul.history { max-height:380px; overflow-y:auto; }
.empty { text-align:center; padding:34px 16px; color:var(--muted); }
.empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }
.loading { color:var(--muted); padding:30px 0; text-align:center; }
.foot { color:var(--muted); font-size:12px; margin-top:24px; }
.logo-row { display:flex; gap:16px; align-items:center; }
.logo-row h2 { margin:0 0 4px; }
.logo-empty { width:56px; height:56px; border-radius:12px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; text-align:center; font-size:11px; color:var(--muted); }
.file-btn { margin:0; }
.form-row { display:grid; grid-template-columns:2fr 1fr 2fr auto; gap:10px; align-items:end; }
@media (max-width:860px) { .form-row { grid-template-columns:1fr; } }
/* dialogs */
dialog.dlg { border:1px solid var(--line); border-radius:16px; padding:0; width:min(480px, calc(100vw - 32px)); background:var(--surface); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.25); }
dialog.dlg::backdrop { background:rgba(20,20,35,.5); }
dialog.dlg form { padding:20px; max-height:85vh; overflow-y:auto; }
dialog.dlg h2 { margin:0 0 6px; font-size:19px; }
.dlg-actions { display:flex; gap:8px; margin-top:14px; }
.dlg-body p { margin:0 0 10px; }
.inline { display:flex; gap:8px; align-items:center; }
.inline input { flex:1; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.two label { margin-top:12px; }
footer.site { border-top:1px solid var(--line); margin-top:30px; padding:18px 0; color:var(--muted); font-size:12px; }
footer.site .wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
footer.site img { height:22px; width:auto; }
@media (max-width:560px) {
  .brand span { display:none; } .head h1 { font-size:21px; } .tile .v { font-size:23px; }
  .head .tools { margin-left:0; width:100%; } .seg { width:100%; } .seg button { flex:1; padding:6px 4px; font-size:12px; }
}
@media print { header.top, .views, .tools, .noprint, footer.site { display:none !important; } .card, .tile { box-shadow:none; break-inside:avoid; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><img src="logo.png" alt=""><b>k12plus</b><span>Monitor</span></a>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="app"><div class="loading">Loading…</div></main>
<footer class="site"><div class="wrap"><img src="logo.png" alt=""><span>K12Plus Monitor by K-Twelve Educational Technologies, Windhoek. Questions: <a href="mailto:paulus@k12plus.app">paulus@k12plus.app</a></span></div></footer>
<script src="charts.js?v=3"></script>
<script src="monitor.js?v=3"></script>
</body>
</html>
